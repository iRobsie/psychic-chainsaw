<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bullet Hell</title>
  <style>
    body { margin:0; background:#000; color:#fff; font-family:Arial, sans-serif; }
    #game { display:block; margin:0 auto; background:#000; }
  </style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<script type="module">
  // Import our game library modules
  import { initCanvas, clear, drawCircle, drawText } from '../game-lib/render/canvas.js';
  import { startGameLoop } from '../game-lib/core/loop.js';
  import { initKeyboard, isKeyDown } from '../game-lib/input/keyboard.js';

  // Initialize canvas and keyboard
  const { canvas, ctx } = initCanvas('#game', 640, 480);
  initKeyboard();

  // Resize the canvas to fill the window.  The game references canvas.width
  // and canvas.height directly so bullets and player adapt automatically.
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // Reset player position near bottom center on resize
    player.x = canvas.width / 2;
    player.y = canvas.height * 0.8;
  }
  window.addEventListener('resize', resizeCanvas);

  // Game state
  const player = { x: 320, y: 400, radius: 10, speed: 220 };

  // After creating the player, set initial canvas dimensions and place the player
  resizeCanvas();
  const bullets = [];
  let timeSinceLastWave = 0;
  const waveInterval = 2.0; // seconds
  let survivedTime = 0;
  let gameOver = false;
  let highScore = 0;

  // Utility to spawn a radial bullet wave
  function spawnWave() {
    const bulletCount = 32;
    const speed = 100 + survivedTime * 5; // gradually faster
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    for (let i = 0; i < bulletCount; i++) {
      const angle = (i / bulletCount) * Math.PI * 2;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      bullets.push({ x: centerX, y: centerY, vx, vy, radius: 4 });
    }
  }

  // Reset game state
  function resetGame() {
    bullets.length = 0;
    // Reset player position relative to canvas size
    player.x = canvas.width / 2;
    player.y = canvas.height * 0.8;
    timeSinceLastWave = 0;
    survivedTime = 0;
    gameOver = false;
  }

  // Update logic
  function update(dt) {
    if (gameOver) return;
    survivedTime += dt;
    timeSinceLastWave += dt;
    // Spawn new wave
    if (timeSinceLastWave >= waveInterval) {
      spawnWave();
      timeSinceLastWave = 0;
    }
    // Player movement
    let dx = 0, dy = 0;
    if (isKeyDown('ArrowLeft') || isKeyDown('KeyA')) dx -= 1;
    if (isKeyDown('ArrowRight') || isKeyDown('KeyD')) dx += 1;
    if (isKeyDown('ArrowUp') || isKeyDown('KeyW')) dy -= 1;
    if (isKeyDown('ArrowDown') || isKeyDown('KeyS')) dy += 1;
    // Normalize diagonal movement
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len;
      dy /= len;
    }
    player.x += dx * player.speed * dt;
    player.y += dy * player.speed * dt;
    // Clamp player within screen
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      // Remove off-screen bullets
      if (b.x < -b.radius || b.x > canvas.width + b.radius || b.y < -b.radius || b.y > canvas.height + b.radius) {
        bullets.splice(i, 1);
        continue;
      }
      // Check collision with player
      const dxp = b.x - player.x;
      const dyp = b.y - player.y;
      const distSq = dxp * dxp + dyp * dyp;
      const radSum = b.radius + player.radius;
      if (distSq < radSum * radSum) {
        gameOver = true;
        highScore = Math.max(highScore, survivedTime);
        break;
      }
    }
  }

  // Render everything
  function render() {
    // Clear screen
    clear(ctx, '#000');
    // Draw bullets
    for (const b of bullets) {
      drawCircle(ctx, b.x, b.y, b.radius, '#f00');
    }
    // Draw player
    drawCircle(ctx, player.x, player.y, player.radius, '#0f0');
    // Draw survival time
    drawText(ctx, `Survived: ${survivedTime.toFixed(1)}s`, 10, 10, { color:'#fff', font:'16px monospace' });
    drawText(ctx, `Best: ${highScore.toFixed(1)}s`, 10, 28, { color:'#888', font:'14px monospace' });
    // Game over message
    if (gameOver) {
      drawText(ctx, 'Game Over!', 320, 200, { color:'#fff', font:'32px sans-serif', textAlign:'center' });
      drawText(ctx, 'Press R to restart', 320, 240, { color:'#ccc', font:'16px sans-serif', textAlign:'center' });
    }
  }

  // Restart on R key
  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyR' && gameOver) {
      resetGame();
    }
  });

  // Start the loop
  startGameLoop(update, render);
</script>
</body>
</html>
