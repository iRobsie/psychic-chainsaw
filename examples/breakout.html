<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Breakout Redux</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: 'JetBrains Mono', system-ui, sans-serif; background: #01060f; color: #e2e8f0; display:flex; flex-direction:column; min-height:100vh; }
    #game { flex: 1; display:block; width:100%; height:100%; }
    .instructions { padding:16px; font-size:14px; line-height:1.5; background:rgba(15,23,42,0.8); border-bottom:1px solid rgba(148,163,184,0.15); }
    .instructions strong { color:#38bdf8; }
  </style>
</head>
<body>
  <section class="instructions">
    <p>Catch power-ups, chain combos, and deflect multiball chaos as you carve through neon crystal brickwork. Launch with <strong>Space</strong> and steer using <strong>←/→</strong> or <strong>A/D</strong>.</p>
  </section>
  <canvas id="game"></canvas>
  <script type="module" src="../games/breakout/main.js"></script>
</body>
</html>
