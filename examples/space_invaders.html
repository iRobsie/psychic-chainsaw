<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Space Invaders</title>
  <style>
    body { margin:0; background:#000; color:#fff; font-family:Arial, sans-serif; }
    #game { display:block; margin:0 auto; background:#000; }
  </style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<script type="module">
  // Import our game library modules
  import { initCanvas, clear, drawRect, drawText } from '../game-lib/render/canvas.js';
  import { startGameLoop } from '../game-lib/core/loop.js';
  import { initKeyboard, isKeyDown } from '../game-lib/input/keyboard.js';
  import { aabbIntersect } from '../game-lib/physics/collision.js';

  // Initialize the canvas and keyboard
  const { canvas, ctx } = initCanvas('#game', 640, 480);

  // Resize the canvas to fill the window.  On resize, update the canvas
  // dimensions.  The game logic references canvas.width/height directly
  // so aliens and player will adapt to new sizes.
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // Optionally reposition the player to stay near the bottom center
    player.x = canvas.width / 2 - player.w / 2;
    player.y = canvas.height - 40;
  }

  window.addEventListener('resize', resizeCanvas);
  initKeyboard();

  // Game state
  // Player will be positioned near the bottom of the canvas.  The exact
  // position is updated on resize via resizeCanvas().
  const player = { x: 0, y: 0, w: 40, h: 20, speed: 300 };

  // After defining player, set the initial canvas size and player position
  resizeCanvas();
  const bullets = [];      // Player bullets
  const aliens = [];       // Invaders
  let alienDirection = 1;  // 1 for right, -1 for left
  let alienSpeed = 40;     // pixels per second
  let bulletCooldown = 0;  // time until next shot allowed (seconds)
  let score = 0;
  let highScore = 0;
  let gameOver = false;

  // Create a grid of aliens (5 rows x 8 columns)
  function initAliens() {
    aliens.length = 0;
    const rows = 5;
    const cols = 8;
    const spacingX = 60;
    const spacingY = 40;
    const startX = 80;
    const startY = 60;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        aliens.push({
          x: startX + c * spacingX,
          y: startY + r * spacingY,
          w: 30,
          h: 20,
        });
      }
    }
  }
  initAliens();

  // Reset the game
  function resetGame() {
    player.x = 320 - player.w / 2;
    bullets.length = 0;
    initAliens();
    alienDirection = 1;
    alienSpeed = 40;
    score = 0;
    gameOver = false;
  }

  // Update logic
  function update(dt) {
    if (gameOver) return;
    // Player movement
    if (isKeyDown('ArrowLeft') || isKeyDown('KeyA')) {
      player.x -= player.speed * dt;
    }
    if (isKeyDown('ArrowRight') || isKeyDown('KeyD')) {
      player.x += player.speed * dt;
    }
    // Clamp within screen
    player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

    // Firing bullets (Space bar)
    bulletCooldown -= dt;
    if ((isKeyDown('Space') || isKeyDown('KeyW')) && bulletCooldown <= 0) {
      bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 10, w: 4, h: 10, vy: -400 });
      bulletCooldown = 0.3; // 300ms cooldown
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y += b.vy * dt;
      // Remove bullet if it leaves the screen
      if (b.y + b.h < 0) {
        bullets.splice(i, 1);
      }
    }

    // Update aliens
    let reachedEdge = false;
    for (const a of aliens) {
      a.x += alienDirection * alienSpeed * dt;
      // Check edges relative to canvas width
      if (a.x < 0 || a.x + a.w > canvas.width) {
        reachedEdge = true;
      }
    }
    // If any alien reached the edge, reverse direction and move down
    if (reachedEdge) {
      alienDirection *= -1;
      for (const a of aliens) {
        a.y += 20;
      }
    }
    // Gradually increase alien speed over time for difficulty
    alienSpeed += dt * 2;

    // Collision detection between bullets and aliens
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      for (let j = aliens.length - 1; j >= 0; j--) {
        const a = aliens[j];
        if (aabbIntersect(b, a)) {
          bullets.splice(i, 1);
          aliens.splice(j, 1);
          score += 10;
          break;
        }
      }
    }
    // Check for loss: aliens reaching player row
    for (const a of aliens) {
      if (a.y + a.h >= player.y) {
        gameOver = true;
        highScore = Math.max(highScore, score);
        break;
      }
    }
    // Win condition: all aliens defeated
    if (aliens.length === 0) {
      gameOver = true;
      highScore = Math.max(highScore, score);
    }
  }

  // Render everything
  function render() {
    // Clear screen
    clear(ctx, '#000');
    // Draw player
    drawRect(ctx, player.x, player.y, player.w, player.h, '#0f0');
    // Draw bullets
    for (const b of bullets) {
      drawRect(ctx, b.x, b.y, b.w, b.h, '#ff0');
    }
    // Draw aliens
    for (const a of aliens) {
      drawRect(ctx, a.x, a.y, a.w, a.h, '#f00');
    }
    // Draw score
    drawText(ctx, `Score: ${score}`, 10, 10, { color:'#fff', font:'16px monospace' });
    drawText(ctx, `High: ${highScore}`, 10, 28, { color:'#888', font:'14px monospace' });
    // Draw game over message
    if (gameOver) {
      drawText(ctx, 'Game Over!', 320, 200, { color:'#fff', font:'32px sans-serif', textAlign:'center' });
      drawText(ctx, aliens.length === 0 ? 'You Win!' : 'Invaders Reached You', 320, 240, { color:'#ccc', font:'18px sans-serif', textAlign:'center' });
      drawText(ctx, 'Press R to restart', 320, 280, { color:'#888', font:'14px sans-serif', textAlign:'center' });
    }
  }

  // Handle restart on R key
  window.addEventListener('keydown', (e) => {
    if ((e.code === 'KeyR' || e.code === 'Space') && gameOver) {
      resetGame();
    }
  });

  // Start the game loop
  startGameLoop(update, render);
</script>
</body>
</html>
