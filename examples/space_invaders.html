<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Orbitfall Command</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; background:#01060f; color:#e2e8f0; font-family:'JetBrains Mono',system-ui,sans-serif; display:flex; flex-direction:column; min-height:100vh; }
    .instructions { padding:16px; font-size:14px; line-height:1.5; background:rgba(15,23,42,0.85); border-bottom:1px solid rgba(148,163,184,0.15); }
    #game { flex:1; display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <section class="instructions">
    <p>Hold the line against smarter fleets. Move with <strong>←/→</strong> or <strong>A/D</strong>, fire with <strong>Space</strong>, and snag power-ups before they drift away.</p>
  </section>
  <canvas id="game"></canvas>
  <script type="module" src="../games/space-invaders/main.js"></script>
</body>
</html>
