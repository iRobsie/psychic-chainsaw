<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snake</title>
  <style>
    body { margin:0; background:#222; font-family:sans-serif; }
    #game { display:block; margin:0 auto; background:#000; }
  </style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<script type="module">
  import { initCanvas, clear, drawRect, drawText } from '../game-lib/render/canvas.js';
  import { startGameLoop } from '../game-lib/core/loop.js';
  import { initKeyboard, isKeyDown } from '../game-lib/input/keyboard.js';

  const { ctx } = initCanvas('#game', 640, 480);
  initKeyboard();

  // Grid settings
  const cellSize = 20;
  const cols = Math.floor(640 / cellSize);
  const rows = Math.floor(480 / cellSize);

  // Game state
  let snake = [];
  let dir = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };
  let food = { x: 10, y: 10 };
  let gameOver = false;
  let score = 0;
  let stepTimer = 0;
  const stepInterval = 0.12; // seconds per move

  function resetGame() {
    snake = [ { x: Math.floor(cols / 2), y: Math.floor(rows / 2) } ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    placeFood();
    gameOver = false;
    score = 0;
    stepTimer = 0;
  }

  function placeFood() {
    while (true) {
      const fx = Math.floor(Math.random() * cols);
      const fy = Math.floor(Math.random() * rows);
      if (!snake.some(seg => seg.x === fx && seg.y === fy)) {
        food.x = fx;
        food.y = fy;
        return;
      }
    }
  }

  // Handle arrow key input
  window.addEventListener('keydown', (e) => {
    if (gameOver && e.code === 'Space') {
      resetGame();
      return;
    }
    switch (e.code) {
      case 'ArrowUp':
        if (dir.y === 0) nextDir = { x: 0, y: -1 };
        break;
      case 'ArrowDown':
        if (dir.y === 0) nextDir = { x: 0, y: 1 };
        break;
      case 'ArrowLeft':
        if (dir.x === 0) nextDir = { x: -1, y: 0 };
        break;
      case 'ArrowRight':
        if (dir.x === 0) nextDir = { x: 1, y: 0 };
        break;
    }
  });

  function update(dt) {
    stepTimer += dt;
    if (stepTimer >= stepInterval && !gameOver) {
      stepTimer -= stepInterval;
      dir = { ...nextDir };
      // Compute new head position
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      // Wrap around edges (optional) or check collision
      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver = true;
        return;
      }
      snake.unshift(head);
      // Check food
      if (head.x === food.x && head.y === food.y) {
        score++;
        placeFood();
      } else {
        snake.pop();
      }
    }
  }

  function render() {
    clear(ctx, '#000');
    // Draw food
    drawRect(ctx, food.x * cellSize, food.y * cellSize, cellSize - 2, cellSize - 2, '#f33');
    // Draw snake
    snake.forEach((seg, index) => {
      const color = index === 0 ? '#0f0' : '#7c7';
      drawRect(ctx, seg.x * cellSize, seg.y * cellSize, cellSize - 2, cellSize - 2, color);
    });
    // Draw score
    drawText(ctx, `Score: ${score}`, 10, 10, { color:'#fff', font:'16px monospace' });
    if (gameOver) {
      drawText(ctx, 'Game Over!', 320, 200, { color:'#fff', font:'32px sans-serif', textAlign:'center' });
      drawText(ctx, 'Press Space to restart', 320, 240, { color:'#ccc', font:'16px sans-serif', textAlign:'center' });
    }
  }

  resetGame();
  startGameLoop(update, render);
</script>
</body>
</html>
