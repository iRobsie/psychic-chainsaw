<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pong: Rally Circuit</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; background:#020617; color:#e2e8f0; font-family:'JetBrains Mono',system-ui,sans-serif; display:flex; flex-direction:column; min-height:100vh; }
    .instructions { padding:16px; font-size:14px; line-height:1.5; background:rgba(15,23,42,0.85); border-bottom:1px solid rgba(148,163,184,0.15); }
    .instructions strong { color:#38bdf8; }
    #game { flex:1; display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <section class="instructions">
    <p>
      Face a reactive AI across a match-play ladder. Move with <strong>↑/↓</strong> or <strong>W/S</strong>, hold <strong>Shift</strong> to sprint, harvest arena power-ups, and chain long rallies to set new records. First to win by two at 11 claims the circuit.
    </p>
  </section>
  <canvas id="game"></canvas>
  <script type="module" src="./games/pong/main.js"></script>
</body>
</html>
