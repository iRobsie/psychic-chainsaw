<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neon Serpent</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; background:#020617; color:#e2e8f0; font-family:'JetBrains Mono',system-ui,sans-serif; display:flex; flex-direction:column; min-height:100vh; }
    .instructions { padding:16px; font-size:14px; line-height:1.5; background:rgba(15,23,42,0.85); border-bottom:1px solid rgba(148,163,184,0.15); }
    .instructions strong { color:#38bdf8; }
    #game { flex:1; display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <section class="instructions">
    <p>
      Guide the synth snake through shifting objectives. Steer with <strong>Arrow keys</strong> or <strong>W/A/S/D</strong>, hoover up rare fruit for combo bonuses,
      trigger temporary wrap portals, and dodge procedurally spawning hazards. Crash and press <strong>Space</strong> to dive back in.
    </p>
  </section>
  <canvas id="game"></canvas>
  <script type="module" src="./games/snake/main.js"></script>
</body>
</html>
