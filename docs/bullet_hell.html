<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nova Drift</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; background:#01060f; color:#e2e8f0; font-family:'JetBrains Mono',system-ui,sans-serif; display:flex; flex-direction:column; min-height:100vh; }
    .instructions { padding:16px; font-size:14px; line-height:1.5; background:rgba(15,23,42,0.85); border-bottom:1px solid rgba(148,163,184,0.15); }
    .instructions strong { color:#38bdf8; }
    #game { flex:1; display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <section class="instructions">
    <p>
      Dance through evolving bullet patterns and chain together perfect dashes. Move with <strong>W/A/S/D</strong> or the arrow keys,
      dash on <strong>Shift</strong> (or <strong>Space</strong>), absorb energy cores to recharge, and survive long enough to unlock
      each new wave mutation.
    </p>
  </section>
  <canvas id="game"></canvas>
  <script type="module" src="./games/bullet-hell/main.js"></script>
</body>
</html>
