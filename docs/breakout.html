<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Breakout Redux</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      font-family: 'JetBrains Mono', system-ui, sans-serif;
      background: #01060f;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .instructions {
      padding: 16px;
      font-size: 14px;
      line-height: 1.5;
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }
    .instructions strong {
      color: #38bdf8;
    }
    #game {
      flex: 1;
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <section class="instructions">
    <p>
      Battle through prism-like brick gardens across escalating waves. Catch falling power-ups to expand your paddle,
      split the ball, trigger energy shields, and slam score multipliers. Launch with <strong>Space</strong>, move with
      <strong>←/→</strong> or <strong>A/D</strong>, and survive every laser-brick barrage to climb the endless circuit.
    </p>
  </section>
  <canvas id="game"></canvas>
  <script type="module" src="./games/breakout/main.js"></script>
</body>
</html>
